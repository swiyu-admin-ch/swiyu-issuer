name: Publish Pact Contracts
run-name: ${{ github.repository }} is publishing Pact consumer contracts

on:
  # push:
  #   branches:
  #     - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish-pacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache PGP keys for pgpverify-maven-plugin
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.m2/repository/pgpkeys-cache
          key: pgp-keys-${{ hashFiles('pgp/keys.list') }}
          restore-keys: pgp-keys-

      - name: Generate Pact contracts
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
            -pl issuer-service -am \
            clean test \
            -Dtest='*PactTest' \
            -Dsurefire.failIfNoSpecifiedTests=false

      - name: Validate generated Pact contracts
        run: |
          set -euo pipefail
          PACT_DIR=issuer-service/target/pacts
          shopt -s nullglob
          PACT_FILES=("$PACT_DIR"/*.json)

          if (( ${#PACT_FILES[@]} == 0 )); then
            echo "No Pact contract was generated in $PACT_DIR" >&2
            exit 1
          fi

          EXPECTED_PROVIDERS='[
            "swiyu-trust-registry",
            "swiyu-identifier-registry",
            "swiyu-status-registry",
            "swiyu-core-business-service"
          ]'

          jq -s -e \
            --arg consumer 'swiyu-issuer' \
            --argjson expectedProviders "$EXPECTED_PROVIDERS" '
            . as $pacts
            | (([$pacts[].provider.name] | sort) == ($expectedProviders | sort))
              and ($pacts | all(.[];
                .consumer.name == $consumer
                and (.metadata.pactSpecification.version
                     | type == "string" and startswith("4."))
                and (.interactions | type == "array" and length > 0)
                and (.interactions | all(.[];
                  (.description | type == "string" and length > 0)
                  and (.providerStates | type == "array" and length > 0)
                  and (.providerStates | all(.[];
                    (.name | type == "string" and length > 0)
                    and (.params | type == "object" and length > 0)
                  ))
                  and (.request.method | type == "string" and length > 0)
                  and (.request.path | type == "string" and startswith("/"))
                  and (.response.status | type == "number")
                ))
              ))
          ' "${PACT_FILES[@]}"

      - name: Publish contracts to Pact Broker
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
          PACT_PUBLISH_CONSUMER_VERSION: ${{ github.sha }}
          PACT_PUBLISH_CONSUMER_BRANCHNAME: ${{ github.ref_name }}
          PACT_PUBLISH_CONSUMER_BUILDURL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          : "${PACT_BROKER_BASE_URL:?PACT_BROKER_BASE_URL secret is required}"
          : "${PACT_BROKER_TOKEN:?PACT_BROKER_TOKEN secret is required}"
          ./mvnw --batch-mode --no-transfer-progress \
            -pl issuer-service \
            au.com.dius.pact.provider:maven:publish \
            -Dpact.broker.url="$PACT_BROKER_BASE_URL" \
            -Dpact.broker.token="$PACT_BROKER_TOKEN" \
            -Dpact.projectVersion="$PACT_PUBLISH_CONSUMER_VERSION"
